<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prüfer-Ansicht — B1-Prüfungstrainer</title>
    <style>
      :root {
        --rule: #2f3e4e; --soft: #f4f6f8; --edge: #ccd3da; --mute: #5b6672;
        --mark: #0f6c4a; --bad: #a4262c; --warn: #8a5a00; --text: #1b2026; --bg: #fff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --rule: #9db4cd; --soft: #1b2027; --edge: #333c46; --mute: #9aa5b1;
          --mark: #56c596; --bad: #ef6b73; --warn: #e0a83a; --text: #e6eaee; --bg: #12161b;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: var(--bg); color: var(--text);
        font: 16px/1.6 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      header {
        border-bottom: 1px solid var(--edge); padding: 0.8rem 1.2rem;
        display: flex; justify-content: space-between; align-items: baseline; gap: 1rem;
        flex-wrap: wrap;
      }
      main { max-width: 62rem; margin: 0 auto; padding: 1.2rem; }
      h1 { font-size: 1.15rem; margin: 0; }
      .abgabe {
        border: 1px solid var(--edge); border-radius: 8px;
        padding: 1rem; margin-bottom: 1rem;
      }
      .abgabe__kopf {
        display: flex; justify-content: space-between; gap: 1rem;
        flex-wrap: wrap; align-items: baseline;
      }
      .abgabe__meta { color: var(--mute); font-size: 0.85rem; }
      .punkte { display: flex; gap: 0.8rem; flex-wrap: wrap; margin: 0.6rem 0; }
      .chip {
        border: 1px solid var(--edge); border-radius: 99px;
        padding: 0.2rem 0.7rem; font-size: 0.85rem;
      }
      .chip--gut { border-color: var(--mark); color: var(--mark); }
      .chip--schlecht { border-color: var(--bad); color: var(--bad); }
      .chip--offen { border-color: var(--warn); color: var(--warn); }
      details { margin-top: 0.7rem; }
      summary { cursor: pointer; font-weight: 600; }
      pre {
        white-space: pre-wrap; background: var(--soft); padding: 0.8rem;
        border-radius: 6px; font: inherit; margin: 0.5rem 0;
      }
      audio { width: 100%; max-width: 28rem; display: block; margin: 0.4rem 0; }
      .raster { display: grid; gap: 0.8rem; grid-template-columns: 1fr 1fr; margin-top: 0.6rem; }
      label { display: block; font-size: 0.85rem; color: var(--mute); }
      input, textarea {
        width: 100%; padding: 0.5rem; font: inherit; border: 1px solid var(--edge);
        border-radius: 6px; background: var(--bg); color: var(--text);
      }
      button {
        font: inherit; padding: 0.55rem 1rem; border: 1px solid var(--rule);
        border-radius: 6px; background: var(--rule); color: var(--bg); cursor: pointer;
      }
      .kriterien { font-size: 0.82rem; color: var(--mute); margin: 0.4rem 0; }
      .leer { color: var(--mute); }
      .gesamt { font-weight: 700; margin-top: 0.5rem; }
    </style>
  </head>
  <body>
    <header>
      <h1>Prüfer-Ansicht</h1>
      <span class="abgabe__meta">
        Lesen und Hören sind bereits ausgewertet. Schreiben und Sprechen bewerten Sie hier.
      </span>
    </header>

    <main id="liste"><p class="leer">Wird geladen …</p></main>

    <script type="module">
      const NOTE = (p) =>
        p >= 90 ? 'sehr gut' : p >= 80 ? 'gut' : p >= 70 ? 'befriedigend'
        : p >= 60 ? 'ausreichend' : 'nicht bestanden';

      const chip = (label, punkte) => {
        if (typeof punkte !== 'number' || Number.isNaN(punkte))
          return `<span class="chip chip--offen">${label}: offen</span>`;
        const klasse = punkte >= 60 ? 'gut' : 'schlecht';
        return `<span class="chip chip--${klasse}">${label}: ${punkte}/100 · ${NOTE(punkte)}</span>`;
      };

      const escape = (s) =>
        String(s ?? '').replace(/[&<>"]/g, (c) =>
          ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c],
        );

      const { abgaben } = await (await fetch('/api/abgaben')).json();
      const liste = document.getElementById('liste');

      if (!abgaben.length) {
        liste.innerHTML =
          '<p class="leer">Noch keine Abgaben. Sie erscheinen hier, sobald eine ' +
          'Prüfung über diesen Server abgegeben wurde.</p>';
      } else {
        liste.innerHTML = abgaben.map(karte).join('');
      }

      function karte(a) {
        const audio = a.dateien
          .filter((d) => /\.(webm|mp4|ogg|wav)$/i.test(d))
          .map(
            (d) =>
              `<div><strong>${escape(d)}</strong>
               <audio controls src="/api/abgabe/${encodeURI(a.pfad)}/datei/${encodeURIComponent(d)}"></audio></div>`,
          )
          .join('');

        const texte = Object.entries(a.schreiben ?? {})
          .filter(([, t]) => t && t.trim())
          .map(
            ([nr, t]) =>
              `<h4>Aufgabe ${escape(nr)} — ${t.trim().split(/\s+/).length} Wörter</h4>
               <pre>${escape(t)}</pre>`,
          )
          .join('') || '<p class="leer">Kein Text abgegeben.</p>';

        return `
        <article class="abgabe" data-pfad="${escape(a.pfad)}">
          <div class="abgabe__kopf">
            <strong>${escape(a.name || 'ohne Namen')}</strong>
            <span class="abgabe__meta">
              ${escape(a.examId)} · ${new Date(a.abgegeben).toLocaleString('de-DE')}
              · Module: ${escape((a.module ?? []).join(', '))}
            </span>
          </div>

          <div class="punkte">
            ${chip('Lesen', a.auswertung?.lesen)}
            ${chip('Hören', a.auswertung?.hoeren)}
            ${chip('Schreiben', a.bewertung?.schreiben)}
            ${chip('Sprechen', a.bewertung?.sprechen)}
          </div>

          <details open><summary>Schreiben</summary>
            <p class="kriterien">
              Aufgaben 1 und 2: je 10 Punkte für Erfüllung, Kohärenz, Wortschatz,
              Strukturen (40). Aufgabe 3: 4 / 4 / 6 / 6 (20). Zusammen 100.
            </p>
            ${texte}
          </details>

          <details><summary>Sprechen — Aufnahmen</summary>
            <p class="kriterien">
              Teil 1: 28 (Erfüllung 8 / Interaktion 4 / Wortschatz 8 / Strukturen 8).
              Teil 2: 40 (12 / 4 / 12 / 12). Teil 3: 16. Aussprache: 16. Zusammen 100.
            </p>
            ${audio || '<p class="leer">Keine Aufnahmen.</p>'}
          </details>

          <div class="raster">
            <label>Schreiben (0–100)
              <input type="number" min="0" max="100" name="schreiben"
                     value="${a.bewertung?.schreiben ?? ''}" />
            </label>
            <label>Sprechen (0–100)
              <input type="number" min="0" max="100" name="sprechen"
                     value="${a.bewertung?.sprechen ?? ''}" />
            </label>
          </div>
          <label style="margin-top:0.6rem">Kommentar für die Kandidatin / den Kandidaten
            <textarea name="kommentar" rows="3">${escape(a.bewertung?.kommentar ?? '')}</textarea>
          </label>
          <p><button type="button" data-speichern>Bewertung speichern</button></p>
          <p class="gesamt" data-gesamt></p>
        </article>`;
      }

      liste.addEventListener('click', async (e) => {
        const knopf = e.target.closest('[data-speichern]');
        if (!knopf) return;
        const karte = knopf.closest('.abgabe');
        const wert = (n) => karte.querySelector(`[name="${n}"]`).value;

        const res = await fetch(
          `/api/abgabe/${encodeURI(karte.dataset.pfad)}/bewertung`,
          {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({
              schreiben: wert('schreiben'),
              sprechen: wert('sprechen'),
              kommentar: wert('kommentar'),
            }),
          },
        );
        const daten = await res.json();
        const ziel = karte.querySelector('[data-gesamt]');
        ziel.textContent = daten.ok
          ? daten.gesamt.vollstaendig
            ? `Gespeichert. Gesamt: Ø ${daten.gesamt.durchschnitt} Punkte — ` +
              `${daten.gesamt.alleBestanden ? 'alle Module bestanden' : 'nicht alle Module bestanden'}.`
            : 'Gespeichert. Noch nicht alle Module bewertet.'
          : 'Speichern fehlgeschlagen.';
      });
    </script>
  </body>
</html>
