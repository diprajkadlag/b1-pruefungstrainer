name: Bug report
description: Something in the app or the tools does not work
labels: [bug]
body:
  - type: textarea
    id: was
    attributes:
      label: What happened?
      description: What you did, what you expected, what you got instead.
    validations: { required: true }
  - type: dropdown
    id: wo
    attributes:
      label: Where?
      options:
        - Hosted app (GitHub Pages)
        - Portable ZIP
        - Local server (npm run serve)
        - Content tools (Python)
    validations: { required: true }
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 131 on Windows 11
  - type: textarea
    id: konsole
    attributes:
      label: Console output
      description: Anything red in the browser console, or the terminal output.
      render: shell
