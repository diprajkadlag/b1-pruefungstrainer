name: Release

# Audio and PDFs are not committed — five papers of listening audio is around
# 200 MB. They are built here and attached to the release instead.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assets:
    name: Build and attach release assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci
      - run: pip install -r tools/requirements.txt
      - name: Install LaTeX
        run: |
          sudo apt-get update
          # lmodern and pgf are separate packages on Ubuntu and are not pulled
          # in by texlive-fonts-recommended or texlive-latex-extra, although
          # b1pruefung.sty needs both: lmodern for the type, pgffor for the
          # ruled writing lines.
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended texlive-latex-extra \
            texlive-lang-german texlive-fonts-recommended \
            texlive-pictures lmodern

      - name: Validate content
        run: python tools/validate.py --strict
      - name: Synthesise audio
        run: python tools/generate_audio.py
      - name: Build PDFs
        run: python tools/build_pdf.py
      - name: Export content
        run: python tools/export_web.py
      - name: Verify no answer leak
        run: python tools/check_no_leak.py

      - run: npm run build --workspace=@b1/core
      - run: npm run build --workspace=@b1/web

      - name: Package assets
        run: |
          mkdir -p release
          zip -rq release/pdfs.zip content/exams/*/pdf content/lernhilfe/pdf
          # Also on its own: most people want the cheat sheet without
          # downloading 20 exam PDFs to find it.
          cp content/lernhilfe/pdf/spickzettel.pdf release/
          for d in content/exams/*/; do
            id=$(basename "$d")
            if [ -d "$d/audio" ]; then
              zip -rqj "release/audio-$id.zip" "$d/audio"
            fi
          done
          cp tools/Start-B1-Trainer.cmd apps/web/dist/
          cp docs/PORTABLE-LIESMICH.txt apps/web/dist/ 2>/dev/null || true
          cd apps/web && zip -rq ../../release/b1-pruefungstrainer-portable.zip dist
          cd ../.. && ls -lh release/

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            ## Downloads

            - **`b1-pruefungstrainer-portable.zip`** — unzip and double-click
              `Start-B1-Trainer.cmd`. No installation, works offline.
            - **`spickzettel.pdf`** — the cheat sheet: strategy for all four
              modules, Redemittel for Sprechen and Schreiben, grammar in
              tables, and the core vocabulary with every verb form.
            - **`pdfs.zip`** — printable papers, answer sheets, speaking cards
              and solution booklets.
            - **`audio-pruefung-NN.zip`** — the listening tracks for one paper.

            Or just use the hosted app, no download needed:
            https://diprajkadlag.github.io/b1-pruefungstrainer/

            ---
            Practice material only — not an official examination, and not
            affiliated with Goethe-Institut e. V., telc gGmbH or the ÖSD.
