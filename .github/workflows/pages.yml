name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install -r tools/requirements.txt

      - name: Install LaTeX
        # The hosted app links the printable papers, so the demo has to carry
        # them. Same package set as release.yml: lmodern and pgffor are their
        # own Ubuntu packages and b1pruefung.sty needs both.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended texlive-latex-extra \
            texlive-lang-german texlive-fonts-recommended \
            texlive-pictures lmodern

      - name: Synthesise listening audio
        run: python tools/generate_audio.py
      - name: Build the printable papers
        run: python tools/build_pdf.py
      - name: Export content for the app
        run: python tools/export_web.py
      - name: Verify no answer leak
        run: python tools/check_no_leak.py

      - run: npm run build --workspace=@b1/core
      - name: Build the app
        # A project page is served from a sub-path, so the bundle and the
        # service worker scope must be built for it.
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build --workspace=@b1/web

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
